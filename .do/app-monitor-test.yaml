name: defidisco-monitor-test
workers:
  - name: defidisco-monitor
    github:
      repo: deficollective/defiscan-v2
      branch: monitoring-compilation
      deploy_on_push: false
    dockerfile_path: Dockerfile.monitor
    instance_size_slug: apps-s-2vcpu-4gb
    instance_count: 1
    envs:
      - key: DATABASE_URL
        type: SECRET
      - key: DATABASE_SSL
        value: "false"
      - key: DISCORD_TOKEN
        type: SECRET
      - key: DISCORD_CHANNEL_ID
        type: SECRET
      - key: ETHEREUM_RPC_URL_FOR_DISCOVERY
        type: SECRET
      - key: ETHEREUM_RPC_URL
        type: SECRET
      - key: ETHERSCAN_API_KEY
        type: SECRET
      - key: DEBANK_API_KEY
        type: SECRET
      - key: RUN_ON_START
        value: "true"
      - key: LOG_LEVEL
        value: "DEBUG"
